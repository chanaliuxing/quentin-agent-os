services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: quentin_memory
    ports:
      # Avoid clashing with a host Postgres already bound to 5432.
      - "55432:5432"
    volumes:
      - quentin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quentin_memory"]
      interval: 2s
      timeout: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - quentin_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  quentin_pg_data:
  quentin_qdrant_data:
