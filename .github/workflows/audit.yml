name: Evidence Audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run evidence audit
        run: |
          python scripts/run_evidence_audit.py --spec blueprint/meta_agent_v3_spec.json --caps data/blueprint/capabilities.json --out data/blueprint/audit_report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: data/blueprint/audit_report.json
