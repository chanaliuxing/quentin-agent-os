[tool.poetry]
name = "autoloop"
version = "0.1.0"
description = "Multi-Agent Orchestration System with LangGraph + Temporal + MCP"
authors = ["AutoLoop Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.2.0"
langchain-core = "^0.3.0"
langchain-openai = "^0.2.0"
temporalio = "^1.7.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-exporter-otlp = "^1.27.0"
gitpython = "^3.1.43"
psutil = "^6.0.0"
aiofiles = "^24.1.0"
structlog = "^24.4.0"
python-dotenv = "^1.0.0"
pathlib = "^1.0.1"
typer = "^0.12.0"
click = ">=8.1.7,<8.2.0"
rich = "^13.7.0"
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
black = "^24.8.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
