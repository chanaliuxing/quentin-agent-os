[project]
name = "quentin-agent-os"
version = "0.1.0"
description = "Project Quentin: Research-Integrated Meta-Agent Operating System Framework"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Wei Zhang", email = "wei.zhang@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic~=2.8.0",
    "pyyaml~=6.0",
    "httpx~=0.27.0",
    "requests~=2.32.0",
    "click~=8.1.7",
    "fastapi~=0.103.0",
    "uvicorn~=0.38.0",
    "chromadb~=1.3.5",
    "python-dotenv~=1.0.0",
    "psycopg[binary]~=3.1.18",
    "pgvector~=0.2.5",
    "radon~=6.0.1",
    "pytest-cov~=4.1.0",
]

[tool.setuptools]
packages = ["quentin", "meta_agent"]
